name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت سورس
        uses: actions/checkout@v4

      - name: دانلود هستهٔ Xray (libv2ray.aar)
        run: |
          mkdir -p app/libs
          curl -fL --retry 3 -o app/libs/libv2ray.aar \
            "https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/libv2ray.aar"
          ls -la app/libs

      - name: دانلود فایل‌های geo (مسیریابی ایران)
        run: |
          mkdir -p app/src/main/assets
          curl -fL --retry 3 -o app/src/main/assets/geoip.dat \
            "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat"
          curl -fL --retry 3 -o app/src/main/assets/geosite.dat \
            "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat"

      - name: کلون و بیلد پل TUN (hev-socks5-tunnel + NDK)
        run: |
          git clone --recursive --depth 1 https://github.com/hev/hev-socks5-tunnel third_party/hev-socks5-tunnel
          NDK=$ANDROID_HOME/ndk/26.3.11579264
          if [ ! -d "$NDK" ]; then
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.3.11579264" >/dev/null
          fi
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            cmake -S app/src/main/cpp -B build/$ABI \
              -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=$ABI -DANDROID_PLATFORM=android-24 \
              -DANDROID_STL=none -DCMAKE_BUILD_TYPE=Release
            cmake --build build/$ABI
            mkdir -p app/src/main/jniLibs/$ABI
            find build/$ABI -name "libgozar-tun.so" -exec cp {} app/src/main/jniLibs/$ABI/ \;
          done
          ls -la app/src/main/jniLibs/*/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: ساخت کلید امضا (فقط بار اول)
        if: ${{ hashFiles('gozar.jks') == '' }}
        run: |
          keytool -genkeypair -v -keystore gozar.jks -alias gozar \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass gozar-pass-2024 -keypass gozar-pass-2024 \
            -dname "CN=Gozar, O=Gozar, C=IR"

      - name: بیلد APK (Release امضاشده)
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: نمایش خطاها (در صورت شکست)
        if: failure()
        run: |
          grep -n -i -E "error:|cannot find symbol|undefined reference|CMake Error" build.log | head -80 || true

      - name: آپلود کلید (فقط بار اول — حتماً دانلود و در ریشهٔ ریپو کامیت کنید)
        if: ${{ hashFiles('gozar.jks') == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: gozar-keystore
          path: gozar.jks

      - name: آپلود خروجی
        uses: actions/upload-artifact@v4
        with:
          name: GozarVPN-APK
          path: app/build/outputs/apk/release/app-release.apk
