name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت سورس
        uses: actions/checkout@v4

      - name: نصب Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: نصب Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: نصب Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: آماده‌سازی NDK
        run: |
          NDK=$ANDROID_HOME/ndk/26.3.11579264
          if [ ! -d "$NDK" ]; then
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.3.11579264" >/dev/null
          fi
          echo "NDK_PATH=$NDK" >> $GITHUB_ENV

      # ═══ هستهٔ Xray: wrapper اختصاصی خودمان دور xtls/xray-core ═══
      # (بدون هیچ وابستگی به AAR بیرونی — همیشه یکسان ساخته می‌شود)
      - name: ساخت هستهٔ Xray (gomobile)
        run: |
          set -e
          export ANDROID_NDK_HOME=$NDK_PATH
          export PATH=$PATH:$(go env GOPATH)/bin
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

          mkdir -p core-src && cd core-src
          cat > go.mod <<'EOF'
          module gozar

          go 1.23
          EOF
          cat > gozar.go <<'EOF'
          package gozar

          import (
              "os"
              "strings"

              "github.com/xtls/xray-core/core"
              _ "github.com/xtls/xray-core/main/distro/all"
              "github.com/xtls/xray-core/infra/conf/serial"
          )

          // V2RayPoint — سازگار با پل بازتابی جاوا
          type V2RayPoint struct {
              server  *core.Instance
              running bool
          }

          func NewV2RayPoint() *V2RayPoint { return &V2RayPoint{} }

          func (p *V2RayPoint) RunV2Ray(config string) error {
              if p.running {
                  return nil
              }
              cf, err := serial.DecodeJSONConfig(strings.NewReader(config))
              if err != nil {
                  return err
              }
              pb, err := cf.Build()
              if err != nil {
                  return err
              }
              inst, err := core.New(pb)
              if err != nil {
                  return err
              }
              if err = inst.Start(); err != nil {
                  return err
              }
              p.server = inst
              p.running = true
              return nil
          }

          func (p *V2RayPoint) StopV2Ray() {
              if p.server != nil {
                  p.server.Close()
                  p.server = nil
              }
              p.running = false
          }

          func (p *V2RayPoint) IsRunning() bool { return p.running }

          // InitV2Env — مسیر فایل‌های geo را برای هسته تنظیم می‌کند
          func InitV2Env(assetPath string) {
              os.Setenv("XRAY_LOCATION_ASSET", assetPath)
              os.Setenv("V2RAY_LOCATION_ASSET", assetPath)
          }
          EOF
          go mod tidy
          echo "== گو ساخته شد — bind با gomobile (۵-۱۰ دقیقه) =="
          gomobile bind -v -target=android -androidapi 24 \
            -ldflags='-s -w' -o ../app/libs/libv2ray.aar ./
          cd ..

          rm -rf /tmp/aarv && mkdir -p /tmp/aarv
          unzip -o -q app/libs/libv2ray.aar classes.jar -d /tmp/aarv
          echo "==== کلاس‌های داخل AAR ===="
          unzip -l /tmp/aarv/classes.jar | grep -i -E "gozar|V2RayPoint" | head -20 || true
          if ! unzip -l /tmp/aarv/classes.jar | grep -qi "V2RayPoint"; then
            echo "FATAL: V2RayPoint در AAR نیست"
            exit 1
          fi
          echo "AAR OK ✓"

      - name: دانلود فایل‌های geo (مسیریابی ایران)
        run: |
          mkdir -p app/src/main/assets
          curl -fL --retry 3 -o app/src/main/assets/geoip.dat \
            "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat"
          curl -fL --retry 3 -o app/src/main/assets/geosite.dat \
            "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat"

      - name: دریافت hev-socks5-tunnel (با ساب‌ماژول‌ها)
        uses: actions/checkout@v4
        with:
          repository: heiher/hev-socks5-tunnel
          path: third_party/hev-socks5-tunnel
          submodules: recursive

      - name: بیلد hev-socks5-tunnel (تشخیص خودکار روش)
        run: |
          set -e
          NDK=$NDK_PATH
          export ANDROID_NDK_HOME=$NDK
          HEV=third_party/hev-socks5-tunnel
          ABIS="arm64-v8a armeabi-v7a x86_64"
          (cd $HEV && git submodule update --init --recursive) || true
          built=0
          if [ -f "$HEV/android/build.sh" ]; then
            echo "== مسیر ۱: build.sh رسمی hev =="
            chmod +x $HEV/android/build.sh
            ( cd $HEV/android && for A in $ABIS; do ./build.sh $A || exit 1; done ) && built=1
          fi
          if [ $built -eq 0 ]; then
            CML=$( ( find $HEV -maxdepth 2 -name CMakeLists.txt ) | head -1 || true )
            if [ -n "$CML" ]; then
              echo "== مسیر ۲: CMake =="
              for A in $ABIS; do
                cmake -S "$(dirname $CML)" -B build-hev/$A \
                  -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
                  -DANDROID_ABI=$A -DANDROID_PLATFORM=android-24 \
                  -DBUILD_SHARED_LIBS=ON -DCMAKE_BUILD_TYPE=Release
                cmake --build build-hev/$A
              done
              built=1
            fi
          fi
          if [ $built -eq 0 ] && [ -f "$HEV/android/jni/Android.mk" ]; then
            echo "== مسیر ۳: ndk-build =="
            ( cd $HEV/android && $NDK/ndk-build \
                NDK_PROJECT_PATH=. NDK_APPLICATION_MK=$PWD/jni/Application.mk \
                APP_BUILD_SCRIPT=$PWD/jni/Android.mk \
                NDK_OUT=$PWD/obj NDK_LIBS_OUT=$PWD/libs ) && built=1
          fi
          if [ $built -ne 1 ]; then
            echo "!! ساختار مخزن hev شناخته نشد"; find $HEV -maxdepth 2 | head -80; exit 1
          fi
          rm -rf hev-out && mkdir -p hev-out
          for A in $ABIS; do
            mkdir -p hev-out/$A
            ( find $HEV build-hev/$A -path "*$A*" \( -name "*.a" -o -name "*.so" \) -exec cp {} hev-out/$A/ \; 2>/dev/null ) || true
          done
          echo "== خروجی‌های hev =="
          find hev-out -type f | sort
          N=$(find hev-out -type f | wc -l)
          if [ "$N" -eq 0 ]; then echo "!! هیچ .a/.so از hev پیدا نشد"; exit 1; fi

      - name: بیلد پل JNI (gozar-tun)
        run: |
          set -e
          NDK=$NDK_PATH
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            STATIC_ARG=""
            A_FILE=$( ( find hev-out/$ABI -name "*.a" ) | head -1 || true )
            if [ -n "$A_FILE" ]; then
              echo "[$ABI] hev استاتیک → لینک مستقیم"
              STATIC_ARG="-DHEV_STATIC_LIB=$PWD/$A_FILE"
            else
              echo "[$ABI] hev داینامیک → dlopen در زمان اجرا"
            fi
            cmake -S app/src/main/cpp -B build-shim/$ABI \
              -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=$ABI -DANDROID_PLATFORM=android-24 \
              -DCMAKE_BUILD_TYPE=Release $STATIC_ARG
            cmake --build build-shim/$ABI
            mkdir -p app/src/main/jniLibs/$ABI
            find build-shim/$ABI -name "libgozar-tun.so" -exec cp {} app/src/main/jniLibs/$ABI/ \;
            if [ -z "$A_FILE" ]; then
              find hev-out/$ABI -name "libhev-socks5-tunnel.so" -exec cp {} app/src/main/jniLibs/$ABI/ \; 2>/dev/null || true
            fi
          done

      - name: بررسی کتابخانه‌های نیتیو
        run: |
          set -e
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            if [ ! -f "app/src/main/jniLibs/$ABI/libgozar-tun.so" ]; then
              echo "FATAL: libgozar-tun.so برای $ABI وجود ندارد"; exit 1
            fi
          done
          ls -la app/src/main/jniLibs/*/

      - name: ساخت کلید امضا (فقط بار اول)
        if: ${{ hashFiles('gozar.jks') == '' }}
        run: |
          keytool -genkeypair -v -keystore gozar.jks -alias gozar \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass gozar-pass-2024 -keypass gozar-pass-2024 \
            -dname "CN=Gozar, O=Gozar, C=IR"

      - name: بیلد APK (Release امضاشده)
        run: |
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: گزارش خطاها (در صورت شکست)
        if: failure()
        run: |
          mkdir -p faillog
          for f in build.log core-src/gomobile.log; do
            if [ -f "$f" ]; then
              echo "==== انتهای $f ===="; tail -60 "$f" || true
              cp "$f" faillog/ || true
            fi
          done
          grep -n -i -E "error|cannot find|undefined|CMake Error|FAILURE:" faillog/* 2>/dev/null | head -80 || true

      - name: آپلود لاگ‌های شکست
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fail-logs
          path: faillog/
          if-no-files-found: ignore

      - name: آپلود کلید امضا (فقط بار اول)
        if: ${{ hashFiles('gozar.jks') == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: gozar-keystore
          path: gozar.jks

      - name: آپلود خروجی
        uses: actions/upload-artifact@v4
        with:
          name: GozarVPN-APK
          path: app/build/outputs/apk/release/app-release.apk
