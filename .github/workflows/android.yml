name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت سورس
        uses: actions/checkout@v4

      - name: دانلود هستهٔ Xray (libv2ray.aar)
        run: |
          mkdir -p app/libs
          curl -fL --retry 3 -o app/libs/libv2ray.aar \
            "https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/libv2ray.aar"
          ls -la app/libs

      - name: نمای API هسته (برای عیب‌یابی)
        run: |
          mkdir -p /tmp/aar && cd /tmp/aar
          unzip -o "$GITHUB_WORKSPACE/app/libs/libv2ray.aar" classes.jar -d . || echo "no classes.jar"
          if [ -f classes.jar ]; then
            echo "==== کلاس‌های پکیج v2ray ===="
            unzip -l classes.jar | grep -i "v2ray" | head -60
            echo "==== امضای متدها ===="
            javap -classpath classes.jar v2ray.V2RayPoint 2>/dev/null || true
            javap -classpath classes.jar v2ray.V2RayVPNServiceSupportsSet 2>/dev/null || true
            javap -classpath classes.jar v2ray.Libv2ray 2>/dev/null || true
            javap -classpath classes.jar v2ray.Tun2Socks 2>/dev/null || true
          fi

      - name: نصب Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: نصب Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: بیلد APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: نمایش خطاها (در صورت شکست)
        if: failure()
        run: |
          grep -n -i -E "error:|cannot find symbol|e: " build.log | head -60 || true

      - name: آپلود خروجی
        uses: actions/upload-artifact@v4
        with:
          name: GozarVPN-APK
          path: app/build/outputs/apk/debug/app-debug.apk
