name: Build Core AAR (یک‌بار)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت سورس
        uses: actions/checkout@v4

      - name: نصب Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: نصب Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: آماده‌سازی NDK
        run: |
          NDK=$ANDROID_HOME/ndk/26.3.11579264
          if [ ! -d "$NDK" ]; then
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.3.11579264" >/dev/null
          fi
          echo "NDK_PATH=$NDK" >> $GITHUB_ENV

      - name: نصب gomobile
        run: |
          set -e
          export ANDROID_NDK_HOME=$NDK_PATH
          export PATH=$PATH:$(go env GOPATH)/bin
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      - name: بیلد AAR هسته (از core-src ریپو)
        run: |
          set -e
          test -f core-src/gozar.go || { echo "FATAL: core-src/gozar.go نیست"; exit 1; }
          export ANDROID_NDK_HOME=$NDK_PATH
          export PATH=$PATH:$(go env GOPATH)/bin
          export GOTOOLCHAIN=auto
          cd core-src
          go mod tidy 2>&1 | tee go-tidy.log
          go get golang.org/x/mobile@latest
          go get golang.org/x/mobile/cmd/gobind@latest
          go get golang.org/x/sys@latest
          grep -n "golang.org/x/mobile" go.mod || { echo "FATAL"; exit 1; }
          set +e
          gomobile bind -v -target=android -androidapi 24 \
            -ldflags='-s -w' -o ../app/libs/libv2ray.aar ./ 2>&1 | tee gomobile.log
          RC=${PIPESTATUS[0]}
          set -e
          if [ "$RC" -ne 0 ]; then
            echo "═════════════ خطای gomobile — ۱۰۰ خط آخر ═════════════"
            tail -100 gomobile.log
            echo "═════════════ پایان ═════════════"
            mkdir -p ../faillog && cp gomobile.log ../faillog/ 2>/dev/null || true
            exit 1
          fi
          echo "bind OK ✓"

      - name: اعتبارسنجی AAR
        run: |
          set -e
          rm -rf /tmp/v && mkdir -p /tmp/v
          unzip -o -q app/libs/libv2ray.aar classes.jar -d /tmp/v
          unzip -l /tmp/v/classes.jar | grep -i V2RayPoint | head -5 || true
          unzip -l /tmp/v/classes.jar | grep -qi V2RayPoint || { echo "FATAL: V2RayPoint نیست"; exit 1; }
          echo "AAR OK ✓  size=$(stat -c%s app/libs/libv2ray.aar) bytes"

      - name: ذخیره در Release مخزن (کش دائمی)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view core-aar -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create core-aar -R "$GITHUB_REPOSITORY" \
              --title "Prebuilt Xray Core AAR" --notes "کش هسته"
          gh release upload core-aar app/libs/libv2ray.aar --clobber -R "$GITHUB_REPOSITORY"
          echo "AAR در Release ذخیره شد ✓"

      - name: آپلود Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libv2ray-aar
          path: app/libs/libv2ray.aar

      - name: آپلود لاگ شکست
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-fail-logs
          path: faillog/
          if-no-files-found: ignore
